name: build-scan-deploy

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

env:
  CHECKOV_IMAGE: bridgecrew/checkov:3.4.3@sha256:bfe9d70bb7f044aba49bd99675813445f106dee6072da583f51008cb667f3a63
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af

jobs:
  source-validation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest --cov=app --cov-report=term --cov-report=xml:coverage.xml tests
        env:
          PYTHONPATH: src

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: app/coverage.xml

  terraform-validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  sast:
    needs: source-validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: app

      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  sca:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy report
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/work" -w /work -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" fs app --scanners vuln --format json --output reports/trivy-sca.json
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" convert --format table reports/trivy-sca.json

      - name: "Gate: no CRITICAL vulnerabilities"
        run: docker run --rm -v "$PWD:/work" -w /work -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" fs app --scanners vuln --severity CRITICAL --ignorefile .trivyignore.yaml --exit-code 1

      - name: "Gate: no HIGH vulnerabilities with a fix available"
        run: docker run --rm -v "$PWD:/work" -w /work -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" fs app --scanners vuln --severity HIGH --ignore-unfixed --ignorefile .trivyignore.yaml --exit-code 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-sca-results
          path: reports/

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" git . \
            --redact --verbose --exit-code 1 \
            --report-format sarif --report-path reports/gitleaks.sarif

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gitleaks-results
          path: reports/

  iac-checkov:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkov
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/src" -w /src "$CHECKOV_IMAGE" \
            -d terraform --skip-path examples --framework terraform --compact \
            -o cli -o junitxml -o sarif \
            --output-file-path console,reports/checkov.junit.xml,reports/checkov.sarif

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checkov-results
          path: reports/

  container-scan:
    runs-on: ubuntu-24.04
    env:
      IMAGE: backend-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: |
          docker build -t "$IMAGE" app
          docker save "$IMAGE" -o image.tar

      - name: Trivy report
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/work" -w /work -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" image --input image.tar --scanners vuln,secret --format json --output reports/trivy.json
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" convert --format table reports/trivy.json
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" convert --format sarif --output reports/trivy.sarif reports/trivy.json

      - name: "Gate: no secrets in image layers"
        run: docker run --rm -v "$PWD:/work" -w /work -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" image --input image.tar --scanners secret --exit-code 1

      - name: "Gate: no CRITICAL vulnerabilities"
        run: docker run --rm -v "$PWD:/work" -w /work -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" image --input image.tar --scanners vuln --severity CRITICAL --ignorefile .trivyignore.yaml --exit-code 1

      - name: "Gate: no HIGH vulnerabilities with a fix available"
        run: docker run --rm -v "$PWD:/work" -w /work -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" image --input image.tar --scanners vuln --severity HIGH --ignore-unfixed --ignorefile .trivyignore.yaml --exit-code 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-results
          path: reports/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          retention-days: 1

  dast:
    needs: container-scan
    runs-on: ubuntu-24.04
    env:
      IMAGE: backend-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Start the app on an isolated network
        run: |
          APP_API_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$APP_API_KEY"
          echo "APP_API_KEY=$APP_API_KEY" >> "$GITHUB_ENV"
          export APP_API_KEY
          docker load -i image.tar
          docker network create --internal dast
          docker run -d --name app --network dast --read-only --cap-drop ALL \
            -e APP_API_KEY -e APP_ENABLE_DOCS=true "$IMAGE"
          timeout 60 sh -c 'until docker logs app 2>&1 | grep -q "Application startup complete"; do sleep 1; done'

      - name: ZAP API scan
        env:
          ZAP_AUTH_HEADER: X-API-Key
          ZAP_AUTH_HEADER_VALUE: ${{ env.APP_API_KEY }}
        run: |
          mkdir -p zap && cp security/zap-rules.tsv zap/ && chmod -R 777 zap
          docker run --rm --network dast -v "$PWD/zap:/zap/wrk:rw" \
            -e ZAP_AUTH_HEADER -e ZAP_AUTH_HEADER_VALUE "$ZAP_IMAGE" \
            zap-api-scan.py -t http://app:8080/openapi.json -f openapi \
            -c zap-rules.tsv -I -r zap.html -J zap.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-results
          path: zap/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [source-validation, terraform-validate, sast, sca, secret-scan, iac-checkov, container-scan, dast]
    runs-on: ubuntu-24.04
    environment: prod
    env:
      IMAGE: backend-api:${{ github.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Deploy (simulation)
        run: |
          docker load -i image.tar
          echo "Approved release: $IMAGE ($(docker inspect --format '{{.Id}}' "$IMAGE"))"
          echo "This is the exact image that passed the container scan."
          echo "A real deployment would assume the prod deploy role through OIDC, push this image to ECR"
          echo "and roll it out to the backend-api namespace from a runner inside the VPC."
